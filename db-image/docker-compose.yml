# Compose standalone pra fast-check (examinador da banca / demo).
# Puxa as 3 imagens publicadas no GHCR e sobe a stack completa sem
# precisar do source code, sem build, sem .env. Pre-requisito unico:
# docker.
#
# Uso (basico):
#   curl -O https://raw.githubusercontent.com/fiap-postech-sw-architecture/postech-sw-arch-p1/main/db-image/docker-compose.yml
#   docker compose up
#   # http://localhost:8080  -> UI (login: ADMIN / ATENDENTE / MECANICO)
#   # http://localhost:8000/docs -> Swagger
#
# Variaveis de ambiente sobrescritivels (todas tem fallback):
#   GHCR_USER  (jbamaral)        # forks: aponte pro proprio namespace GHCR
#   APP_PORT   (8000)            # se 8000 ja esta em uso
#   UI_PORT    (8080)            # se 8080 ja esta em uso
#   DB_PORT    (nao exposto)     # nao publica porta do postgres por default
#
# Imagens (publicadas via `make update-ghcr` no repo upstream):
#   - <prefix>-db:seeded  postgres:16 + dump da DB seedada
#   - <prefix>-app:latest FastAPI backend
#   - <prefix>-ui:latest  NiceGUI sandbox
#
# `pull_policy: always` garante que `docker compose up` sempre busca a
# tag corrente do GHCR -- sem isso, uma imagem local stale (de uma
# corrida anterior) seria silenciosamente reutilizada e o examinador
# acabaria validando o commit errado.
#
# As 3 imagens logam a SHA do commit que as gerou no startup ("commit
# <12-char-sha> | <iso-date>"); use `docker compose logs` ou
# `docker inspect <image>` (LABEL org.opencontainers.image.revision)
# pra validar.
#
# Credenciais dev-only (publicas por design — ver README do repo):
#   admin@pytstop.dev      / admin-dev-pass-2026
#   atendente@pytstop.dev  / atendente-dev-pass-2026
#   mecanico@pytstop.dev   / mecanico-dev-pass-2026

services:
  postgres:
    image: ghcr.io/${GHCR_USER:-jbamaral}/postech-sw-arch-p1-db:seeded
    pull_policy: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pytstop"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: ghcr.io/${GHCR_USER:-jbamaral}/postech-sw-arch-p1-app:latest
    pull_policy: always
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    # Healthcheck probe `/api/v1/saude` (no-auth, defined em
    # `src/autenticacao/interfaces/saude_router.py`). Sem isso, o Docker
    # marca o container como "Up" assim que o entrypoint dispara, mas o
    # uvicorn ainda demora segundos a dezenas de segundos pra realmente
    # responder -- especialmente sob emulacao QEMU (imagens publicadas em
    # arm64 rodando em host amd64). Janela tipica observada: ~40s onde a
    # porta 8000 ja esta aberta (proxy do Docker) mas requests resultam em
    # ERR_EMPTY_RESPONSE no browser. Com healthcheck + `--wait` no `up`,
    # o prompt so retorna quando o app realmente atende.
    #
    # Probe usa Python (garantido na imagem -- e o que roda o uvicorn) em
    # vez de curl/wget que podem nao existir na imagem slim. `start_period`
    # generoso pra absorver QEMU; `retries × interval` = 20 × 5s = 100s
    # de tolerancia depois disso.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/saude', timeout=2).status == 200 else 1)"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    # ENCRYPTION_KEY (Fernet, base64 url-safe 32 bytes) PRECISA bater com
    # a key usada no seed -- senao CPF/CNPJ persistidos viram lixo
    # criptografico.
    #
    # ⚠️  AVISO DE SEGURANCA  ⚠️
    # Esta key esta committada em texto plano EXCLUSIVAMENTE pra rodar o
    # dump seedado de demo (dados sinteticos -- 7 clientes ficticios).
    # NUNCA reutilizar este valor em:
    #   - qualquer ambiente nao-demo (staging, prod, CI privado)
    #   - qualquer DB com dados reais ou semi-reais
    #   - qualquer outro repo / outro projeto
    # A key esta no historico git permanentemente; rotacao requer regerar
    # o seed dump com key nova e fazer push de novas imagens GHCR.
    # Pra dev local com `make reset-db`, use a `.env.dev` (gitignored).
    #
    # `JWT_SECRET` so precisa ter 32+ bytes (qualquer valor estavel
    # funciona pro examinador; tokens nao persistem entre boots).
    environment:
      DATABASE_URL: postgresql://pytstop:pytstop@postgres:5432/pytstop
      ENCRYPTION_KEY: qq-InvndkyPiUbzx8gNJaIqjxboY0yD3ieh9VBqjc3M=
      JWT_SECRET: dev-secret-change-me-this-is-at-least-32-bytes-long-for-hs256
      JWT_EXPIRATION_MINUTES: "30"
      ENVIRONMENT: development
      CORS_ORIGINS: http://localhost:3000,http://localhost:8080
      RUN_MIGRATIONS_ON_STARTUP: "true"
      RUN_SEED_ON_STARTUP: "false"

  ui:
    image: ghcr.io/${GHCR_USER:-jbamaral}/postech-sw-arch-p1-ui:latest
    pull_policy: always
    ports:
      - "${UI_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_healthy
    environment:
      BACKEND_URL: http://app:8000
      UI_PORT: "8080"
