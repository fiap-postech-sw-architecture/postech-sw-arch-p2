# Chave unica do projeto
sonar.projectKey=pytstop-app
sonar.projectName=PytStop

# Onde estao os arquivos fonte (separados por virgula)
sonar.sources=src

# Linguagem principal e versao
sonar.language=py
sonar.python.version=3.14

# O que o Sonar DEVE IGNORAR na analise (muito importante!)
sonar.exclusions=**/.venv/**, **/tests/**, full-test/**, migrations/**, scripts/**, docs/**, **/__pycache__/**, .git/**, **/*.pyc, **/.pytest_cache/**, **/.mypy_cache/**, **/.ruff_cache/**

# Se voce tiver testes com pytest-cov, aponte o relatorio aqui:
sonar.python.coverage.reportPaths=coverage.xml

# Alinha o universo de cobertura do Sonar ao gate do .coveragerc: os omits do
# gate (arquivos sem linha executavel relevante ou cobertos por E2E) nao devem
# entrar no denominador aqui — sem isso o Sonar reporta ~93% enquanto o gate
# real (pytest --cov-fail-under=95) mede 97%+.
sonar.coverage.exclusions=**/__init__.py
