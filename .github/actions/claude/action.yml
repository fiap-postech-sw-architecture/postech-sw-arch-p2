name: Run Claude Code Action
description: |
  Wrapper local que encapsula args, tools e secrets comuns do
  `anthropics/claude-code-action@v1`. Mantem a configuracao em UM lugar
  pra evitar drift entre `claude-code-review.yml` (auto-review em PR)
  e `claude-on-demand.yml` (`@claude` mention + workflow_dispatch).

  Uso:

      - uses: ./.github/actions/claude
        with:
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: <prompt completo>             # opcional
          trigger_phrase: "@claude"             # opcional
          extra_allowed_tools: "tool_a,tool_b"  # opcional

  O que NAO fica aqui (precisa estar no workflow chamador): trigger
  (`on:`), `permissions:` no nivel do job, `concurrency`,
  `timeout-minutes`, `if:` de gate (fork/draft), e o `actions/checkout`
  step. Esses sao propriedades do job, nao do step composite.

inputs:
  oauth_token:
    description: Claude Code OAuth token (Claude Max plan). Passar via secrets.
    required: true
  github_token:
    description: |
      GitHub token. Passar `${{ secrets.GITHUB_TOKEN }}` — auto-gerado
      pelo runner. Workaround pro bug
      https://github.com/anthropics/claude-code-action/issues/721
      (sem ele a action tenta GitHub App OIDC e falha com 401 quando o
      auth e via OAuth).
    required: true
  prompt:
    description: |
      Prompt completo. Pra `@claude` mention/issue_comment, deixe vazio
      — a action detecta o texto pos-mencao automaticamente via
      `trigger_phrase`.
    required: false
    default: ''
  trigger_phrase:
    description: |
      Texto que ativa a action em comments (ex.: "@claude"). So usado
      em on-demand. Vazio no auto-review.
    required: false
    default: ''
  extra_allowed_tools:
    description: |
      Tools adicionais a anexar ao set base (CSV). Ex.: on-demand
      adiciona `Bash(gh issue comment:*),Bash(gh issue view:*)` pra
      responder em issues alem de PRs.
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Build claude_args
      id: args
      shell: bash
      run: |
        # Lista base de tools — alinhada com o template oficial
        # https://github.com/anthropics/claude-code-action/blob/v1/docs/solutions.md#automatic-pr-code-review
        # Sem essas tools, o Claude nao consegue publicar review (run
        # anterior em PR #81 gastou $9.59 sem postar nada).
        BASE_TOOLS="mcp__github_inline_comment__create_inline_comment,mcp__github_ci__get_ci_status,mcp__github_ci__download_job_log,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Read,Grep,Glob,Task"

        if [ -n "${{ inputs.extra_allowed_tools }}" ]; then
          ALLOWED_TOOLS="${BASE_TOOLS},${{ inputs.extra_allowed_tools }}"
        else
          ALLOWED_TOOLS="$BASE_TOOLS"
        fi

        {
          echo 'value<<EOF_ARGS'
          echo "--model opus"
          echo "--effort max"
          echo "--max-turns 50"
          echo "--allowedTools \"${ALLOWED_TOOLS}\""
          echo 'EOF_ARGS'
        } >> "$GITHUB_OUTPUT"

    - name: Run Claude Code Action
      uses: anthropics/claude-code-action@v1
      with:
        claude_code_oauth_token: ${{ inputs.oauth_token }}
        github_token: ${{ inputs.github_token }}
        prompt: ${{ inputs.prompt }}
        trigger_phrase: ${{ inputs.trigger_phrase }}
        track_progress: true
        use_sticky_comment: true
        additional_permissions: |
          actions: read
        claude_args: ${{ steps.args.outputs.value }}
