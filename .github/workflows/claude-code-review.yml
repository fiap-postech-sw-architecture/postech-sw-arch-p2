name: Claude Code Review

# Roda automaticamente APENAS quando um PR e aberto/reaberto/sai-de-draft
# com alvo main. Sem trigger em "synchronize": pushes seguintes no mesmo
# PR nao re-revisam — pra pedir nova review apos mudancas, use "Claude
# On-Demand" (workflow_dispatch ou comentario "@claude review"). Detalhes
# no README.md secao "Code review automatizado pelo Claude".
#
# Args/tools/secrets comuns ficam em `.github/actions/claude/action.yml`
# (composite local). Prompt fica em `.github/claude-prompts/code-review.md`.

on:
  pull_request:
    types: [opened, reopened, ready_for_review]
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '**/*.png'
      - '**/*.jpg'
      - '**/*.svg'
      - 'logo-*'

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Claude reviews the PR
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.draft == false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build review prompt
        id: prompt
        shell: bash
        run: |
          # Concatena cabecalho de contexto + corpo do prompt versionado.
          # Iterar regras de review = editar `.github/claude-prompts/code-review.md`
          # sem mexer neste workflow.
          {
            echo 'value<<EOF_PROMPT'
            echo "REPO: ${{ github.repository }}"
            echo "PR NUMBER: ${{ github.event.pull_request.number }}"
            echo ""
            cat .github/claude-prompts/code-review.md
            echo 'EOF_PROMPT'
          } >> "$GITHUB_OUTPUT"

      - name: Run Claude
        uses: ./.github/actions/claude
        with:
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: ${{ steps.prompt.outputs.value }}
