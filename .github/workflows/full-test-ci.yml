name: full-test (ci)

# Triggers: PR pra main (gate de qualidade antes do merge), push em main
# (confirmacao pos-merge), manual (workflow_dispatch), e nightly (cron).
# Roda o plano COMPLETO do harness (``pytest -m slowest`` -> test_plano_full,
# com sleeps reais e todas as journeys) em PR/push/nightly. Ele e superset do
# plano reduzido (test_plano_ci), entao cobre o subset sem rodar os dois —
# rodar ambos colidiria documentos (mesmo seed gera os mesmos CPFs).
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC diario

jobs:
  ci-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Sync deps
        run: uv sync --extra full-test --frozen

      - name: Materialize .env.dev for docker compose
        # docker-compose.yml usa env_file: .env.dev; criamos a partir do .example
        # sobrescrevendo apenas ADMIN_*, RUN_SEED_ON_STARTUP e ENCRYPTION_KEY
        # (necessaria para PII criptografada em repouso; sem ela, o app gera
        # efemera e perde dados entre restarts). Email usa .dev (pydantic
        # rejeita .local). ``uv run`` e critico aqui: ``cryptography`` vive no
        # venv gerenciado pelo uv (nao no Python do setup-python) — usar o
        # python do PATH falhou com ModuleNotFoundError.
        run: |
          cp .env.dev.example .env.dev
          ENCRYPTION_KEY=$(uv run python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          sed -i 's|^ADMIN_EMAIL=.*|ADMIN_EMAIL=full-test-admin@pytstop.dev|' .env.dev
          sed -i 's|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=ChangeMeStrong123!|' .env.dev
          sed -i 's|^RUN_SEED_ON_STARTUP=.*|RUN_SEED_ON_STARTUP=true|' .env.dev
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=${ENCRYPTION_KEY}|" .env.dev

      - name: Start stack
        env:
          ADMIN_EMAIL: full-test-admin@pytstop.dev
          ADMIN_PASSWORD: ChangeMeStrong123!
          RUN_MIGRATIONS_ON_STARTUP: "true"
          RUN_SEED_ON_STARTUP: "true"
          # RF-022: pino o token do webhook para o container app. O harness
          # le o MESMO valor via ORCAMENTO_WEBHOOK_TOKEN no step "Run plano CI",
          # garantindo paridade — sem isso o app cairia no default de demo do
          # compose e a journey fase2 nao teria como reproduzir o token.
          ORCAMENTO_WEBHOOK_TOKEN: ci-webhook-orcamento-token
        run: docker compose up -d

      - name: Wait for health
        env:
          FULL_TEST_BASE_URL: http://localhost:8000
          FULL_TEST_DATABASE_URL: postgresql://pytstop:pytstop@localhost:5432/pytstop
          FULL_TEST_ADMIN_EMAIL: full-test-admin@pytstop.dev
          FULL_TEST_ADMIN_PASSWORD: ChangeMeStrong123!
        run: PYTHONPATH=full-test uv run python -m full_test healthwait --timeout 120

      - name: Seed
        env:
          FULL_TEST_BASE_URL: http://localhost:8000
          FULL_TEST_DATABASE_URL: postgresql://pytstop:pytstop@localhost:5432/pytstop
          FULL_TEST_ADMIN_EMAIL: full-test-admin@pytstop.dev
          FULL_TEST_ADMIN_PASSWORD: ChangeMeStrong123!
          FULL_TEST_N_CLIENTES: "2"
          FULL_TEST_N_OPERADORES: "1"
          FULL_TEST_N_ADMINS: "1"
        run: PYTHONPATH=full-test uv run python -m full_test seed

      - name: Run plano completo (E2E integrado)
        env:
          FULL_TEST_BASE_URL: http://localhost:8000
          FULL_TEST_DATABASE_URL: postgresql://pytstop:pytstop@localhost:5432/pytstop
          FULL_TEST_ADMIN_EMAIL: full-test-admin@pytstop.dev
          FULL_TEST_ADMIN_PASSWORD: ChangeMeStrong123!
          FULL_TEST_N_CLIENTES: "2"
          FULL_TEST_N_OPERADORES: "1"
          FULL_TEST_N_ADMINS: "1"
          FULL_TEST_RESET_ANTES_DE_SEED: "0"  # ja veio limpo do step anterior
          # RF-022: mesmo valor pinado no container (step "Start stack"), para
          # que a journey fase2 envie o token correto e o webhook responda 200.
          ORCAMENTO_WEBHOOK_TOKEN: ci-webhook-orcamento-token
        run: PYTHONPATH=full-test uv run pytest full-test/tests/test_parallel_usage.py -m "slowest" -v

      # DAST (TD-011 / ADR-011): roda o OWASP ZAP baseline (scan passivo) contra
      # a MESMA stack compose que ja esta de pe e saudavel (steps acima). Alvo:
      # o OpenAPI vivo (http://localhost:8000/openapi.json) — o mesmo alvo da
      # evidencia de fase 1 (relatorio-vulnerabilidades.md). Roda SEM ``-I``,
      # entao e um gate real: os 2 warnings aceitos da fase 1 (10049, 90004)
      # estao como IGNORE em .zap/rules.tsv e qualquer achado NOVO falha o job.
      # ``--network host`` da ao container do ZAP acesso a porta 8000 publicada
      # pelo compose no runner. Relatorios saem em .zap/ (NUNCA sobrescreve os
      # relatorios versionados da fase 1 em docs/seguranca/). ``mkdir -p .zap``
      # garante a pasta escrivel para o mount; o ``chmod`` evita que o usuario
      # do container (uid 1000 zap) esbarre em permissao ao escrever o relatorio.
      - name: DAST — OWASP ZAP baseline
        run: |
          mkdir -p "${{ github.workspace }}/.zap"
          chmod 777 "${{ github.workspace }}/.zap"
          docker run --rm --network host \
            -v "${{ github.workspace }}/.zap:/zap/wrk:rw" \
            -t zaproxy/zap-stable zap-baseline.py \
            -t http://localhost:8000/openapi.json \
            -c rules.tsv \
            -J zap-report.json \
            -r zap-report.html \
            -w zap-report.md

      - name: Upload ZAP report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-dast-report
          path: .zap/zap-report.*
          retention-days: 14

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: full-test-reports
          path: full-test/reports/
          retention-days: 14

      - name: Dump docker logs on failure
        if: failure()
        run: |
          docker compose logs --tail=200 > /tmp/docker-logs.txt || true
          cat /tmp/docker-logs.txt

      - name: Teardown
        if: always()
        run: docker compose down -v
