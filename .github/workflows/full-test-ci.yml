name: full-test (ci)

# Triggers: PR pra main (gate de qualidade antes do merge), push em main
# (confirmacao pos-merge), manual (workflow_dispatch), e nightly (cron).
# O modo CI (``pytest -m "not slowest"``) roda em ~1 minuto; o nightly roda
# o mesmo modo sem custo adicional, mantendo o historico diario.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"  # 04:00 UTC diario

jobs:
  ci-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        run: pip install uv

      - name: Sync deps
        run: uv sync --extra full-test --frozen

      - name: Materialize .env.dev for docker compose
        # docker-compose.yml usa env_file: .env.dev; criamos a partir do .example
        # sobrescrevendo apenas ADMIN_*, RUN_SEED_ON_STARTUP e ENCRYPTION_KEY
        # (necessaria para PII criptografada em repouso; sem ela, o app gera
        # efemera e perde dados entre restarts). Email usa .dev (pydantic
        # rejeita .local). ``uv run`` e critico aqui: ``cryptography`` vive no
        # venv gerenciado pelo uv (nao no Python do setup-python) — usar o
        # python do PATH falhou com ModuleNotFoundError.
        run: |
          cp .env.dev.example .env.dev
          ENCRYPTION_KEY=$(uv run python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
          sed -i 's|^ADMIN_EMAIL=.*|ADMIN_EMAIL=full-test-admin@pytstop.dev|' .env.dev
          sed -i 's|^ADMIN_PASSWORD=.*|ADMIN_PASSWORD=ChangeMeStrong123!|' .env.dev
          sed -i 's|^RUN_SEED_ON_STARTUP=.*|RUN_SEED_ON_STARTUP=true|' .env.dev
          sed -i "s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=${ENCRYPTION_KEY}|" .env.dev

      - name: Start stack
        env:
          ADMIN_EMAIL: full-test-admin@pytstop.dev
          ADMIN_PASSWORD: ChangeMeStrong123!
          RUN_MIGRATIONS_ON_STARTUP: "true"
          RUN_SEED_ON_STARTUP: "true"
        run: docker compose up -d

      - name: Wait for health
        env:
          FULL_TEST_BASE_URL: http://localhost:8000
          FULL_TEST_DATABASE_URL: postgresql://pytstop:pytstop@localhost:5432/pytstop
          FULL_TEST_ADMIN_EMAIL: full-test-admin@pytstop.dev
          FULL_TEST_ADMIN_PASSWORD: ChangeMeStrong123!
        run: PYTHONPATH=full-test uv run python -m full_test healthwait --timeout 120

      - name: Seed
        env:
          FULL_TEST_BASE_URL: http://localhost:8000
          FULL_TEST_DATABASE_URL: postgresql://pytstop:pytstop@localhost:5432/pytstop
          FULL_TEST_ADMIN_EMAIL: full-test-admin@pytstop.dev
          FULL_TEST_ADMIN_PASSWORD: ChangeMeStrong123!
          FULL_TEST_N_CLIENTES: "2"
          FULL_TEST_N_OPERADORES: "1"
          FULL_TEST_N_ADMINS: "1"
        run: PYTHONPATH=full-test uv run python -m full_test seed

      - name: Run plano CI
        env:
          FULL_TEST_BASE_URL: http://localhost:8000
          FULL_TEST_DATABASE_URL: postgresql://pytstop:pytstop@localhost:5432/pytstop
          FULL_TEST_ADMIN_EMAIL: full-test-admin@pytstop.dev
          FULL_TEST_ADMIN_PASSWORD: ChangeMeStrong123!
          FULL_TEST_N_CLIENTES: "2"
          FULL_TEST_N_OPERADORES: "1"
          FULL_TEST_N_ADMINS: "1"
          FULL_TEST_RESET_ANTES_DE_SEED: "0"  # ja veio limpo do step anterior
        run: PYTHONPATH=full-test uv run pytest full-test/tests/test_parallel_usage.py -m "not slowest" -v

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-reports
          path: full-test/reports/
          retention-days: 14

      - name: Dump docker logs on failure
        if: failure()
        run: |
          docker compose logs --tail=200 > /tmp/docker-logs.txt || true
          cat /tmp/docker-logs.txt

      - name: Teardown
        if: always()
        run: docker compose down -v
