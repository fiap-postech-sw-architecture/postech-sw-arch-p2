name: CI

on:
  push:
    branches: [dev-start, main]
  pull_request:
    branches: [main]

env:
  PYTHONDONTWRITEBYTECODE: "1"
  DATABASE_URL: "postgresql://pytstop:pytstop@localhost:5432/pytstop_test"
  JWT_SECRET: "ci-test-secret-key-not-for-production"
  ENCRYPTION_KEY: ""
  ENVIRONMENT: "test"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Verify uv.lock is up to date with pyproject.toml
        run: uv lock --check
      - name: Install dependencies from lockfile
        run: uv sync --extra test --extra ui --frozen
      - name: Ruff check
        run: uv run ruff check src/ ui/ tests/ .claude/skills/entrega-tech-challenge/scripts/gerar_pdf_entrega.py
      - name: Ruff format check
        run: uv run ruff format --check src/ ui/ tests/ .claude/skills/entrega-tech-challenge/scripts/gerar_pdf_entrega.py
      - name: Architecture contracts (import-linter)
        run: uv run lint-imports

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies from lockfile
        run: uv sync --extra test --extra ui --frozen
      - name: Mypy
        run: uv run mypy src/ ui/ .claude/skills/entrega-tech-challenge/scripts/gerar_pdf_entrega.py

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies from lockfile
        run: uv sync --extra test --extra ui --frozen
      # Escopo alinhado ao Makefile target `security` (#75): inclui relay/ e
      # scripts/ — antes o CI varria só src/ ui/, deixando relay/scripts fora.
      - name: Bandit security scan
        run: uv run bandit -r src/ ui/ relay/ scripts/ .claude/skills/entrega-tech-challenge/scripts/gerar_pdf_entrega.py -c pyproject.toml --severity-level high

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pytstop
          POSTGRES_PASSWORD: pytstop
          POSTGRES_DB: pytstop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install dependencies from lockfile
        run: uv sync --extra test --extra ui --frozen
      - name: Run unit tests with coverage
        run: |
          uv run pytest tests/unitarios/ \
            --no-lint \
            --cov=src \
            --cov-fail-under=95 \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -x \
            --tb=short \
            -m "not lento"
      - name: Run UI unit tests with separate coverage gate
        run: |
          uv run pytest tests/unitarios/ui/ \
            --no-lint \
            --cov=ui \
            --cov-report=term-missing \
            --cov-fail-under=95 \
            -m "not lento" \
            -x \
            --tb=short
      - name: Run integration tests
        run: |
          set +e
          uv run pytest tests/integracao/ \
            --no-lint \
            -x \
            --tb=short
          rc=$?
          # Exit code 5 = no tests collected (acceptable when integration suite is empty)
          if [ $rc -eq 5 ]; then
            echo "No integration tests found — skipping."
            exit 0
          fi
          exit $rc
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # TD-012 (ADR-012): SBOM CycloneDX automatizado no CI. Reusa `make sbom`
      # como fonte unica (versao do gerador pinada + comandos + validacao
      # bomFormat vivem so no Makefile), garantindo paridade exata CI<->local.
      - name: Gerar SBOM CycloneDX
        run: make sbom
      # Sem `if: always()`: so publica se `make sbom` (geracao + validacao) passar,
      # pra nunca subir um SBOM parcial/invalido como artefato.
      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 90
