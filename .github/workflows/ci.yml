name: CI

on:
  push:
    branches: [dev-start, main]
  pull_request:
    branches: [main]

env:
  PYTHONDONTWRITEBYTECODE: "1"
  DATABASE_URL: "postgresql://pytstop:pytstop@localhost:5432/pytstop_test"
  JWT_SECRET: "ci-test-secret-key-not-for-production"
  ENCRYPTION_KEY: ""
  ENVIRONMENT: "test"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test]" ruff
      - name: Ruff check
        run: ruff check src/ tests/
      - name: Ruff format check
        run: ruff format --check src/ tests/

  type-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test]" mypy
      - name: Mypy
        run: mypy src/

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test]" bandit
      - name: Bandit security scan
        run: bandit -r src/ -c pyproject.toml --severity-level high

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pytstop
          POSTGRES_PASSWORD: pytstop
          POSTGRES_DB: pytstop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[test]"
      - name: Run unit tests with coverage
        run: |
          pytest tests/unitarios/ \
            --no-lint \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -x \
            --tb=short
      - name: Run integration tests
        run: |
          set +e
          pytest tests/integracao/ \
            --no-lint \
            -x \
            --tb=short
          rc=$?
          # Exit code 5 = no tests collected (acceptable when integration suite is empty)
          if [ $rc -eq 5 ]; then
            echo "No integration tests found — skipping."
            exit 0
          fi
          exit $rc
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
