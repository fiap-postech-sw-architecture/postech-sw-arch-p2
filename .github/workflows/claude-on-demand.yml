name: Claude On-Demand

# Acionado por:
# - Comentario "@claude ..." em qualquer PR ou issue
# - Run manual via Actions -> Claude On-Demand -> Run workflow
#
# Para o pattern de mencao em PRs, o trigger usa `issue_comment`: GitHub
# trata comentarios em PR como comentarios de issue (mesma API). Reviews
# inline de codigo usam `pull_request_review_comment`.
#
# Limitacao do GitHub: workflows acionados por `issue_comment` sempre
# rodam do branch DEFAULT (main). So vao funcionar pra qualquer PR DEPOIS
# do merge deste arquivo na main. Pra usar antes do merge, rode via
# `workflow_dispatch` (Run workflow), que pode ser executado em qualquer
# branch. Detalhes no README.md.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Instrucao para o Claude (ex: "review PR #81 com foco em seguranca")'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  # id-token: write necessario mesmo com OAuth token — ver comentario
  # equivalente em claude-code-review.yml.
  id-token: write

jobs:
  on-demand:
    name: Claude responds
    # Para comments, so executa quando contem "@claude" (evita custo em
    # qualquer comentario do repo). workflow_dispatch sempre executa.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.comment != null && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Em comments, a action detecta "@claude" automaticamente e usa
          # o texto pos-mencao como prompt. workflow_dispatch passa o
          # prompt explicitamente via input.
          prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || '' }}
          trigger_phrase: "@claude"
          claude_args: "--max-turns 10"
