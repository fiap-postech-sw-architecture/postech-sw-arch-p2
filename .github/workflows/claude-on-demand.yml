name: Claude On-Demand

# Acionado por:
# - Comentario "@claude ..." em qualquer PR ou issue
# - Run manual via Actions -> Claude On-Demand -> Run workflow
#
# Para o pattern de mencao em PRs, o trigger usa `issue_comment`: GitHub
# trata comentarios em PR como comentarios de issue (mesma API). Reviews
# inline de codigo usam `pull_request_review_comment`.
#
# Limitacao do GitHub: workflows acionados por `issue_comment` sempre
# rodam do branch DEFAULT (main). So vao funcionar pra qualquer PR DEPOIS
# do merge deste arquivo na main. Pra usar antes do merge, rode via
# `workflow_dispatch` (Run workflow), que precisa do file na main pra
# o lookup da API. Detalhes no README.md.
#
# Args/tools/secrets comuns ficam em `.github/actions/claude/action.yml`
# (composite local).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Instrucao para o Claude (ex: "review PR #81 com foco em seguranca")'
        required: true
        type: string

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  on-demand:
    name: Claude responds
    # Para comments, so executa quando contem "@claude" (evita custo em
    # qualquer comentario do repo). workflow_dispatch sempre executa.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.comment != null && contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Claude
        uses: ./.github/actions/claude
        with:
          oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # workflow_dispatch passa prompt explicito; em comments, a action
          # detecta `@claude` automaticamente e usa o texto pos-mencao.
          prompt: ${{ github.event_name == 'workflow_dispatch' && inputs.prompt || '' }}
          trigger_phrase: '@claude'
          # Tools extras pra responder em issues alem de PRs (composite
          # ja inclui as de PR no set base).
          extra_allowed_tools: 'Bash(gh issue comment:*),Bash(gh issue view:*)'
          # On-demand assume "user pediu manual = quer revisao mais profunda
          # mesmo que demore mais". Sobrescreve os defaults rapidos do
          # composite (sonnet/medium/30) pelo perfil deep (opus/max/50) —
          # ~3-4x mais lento por turn, mas explora mais hipoteses e
          # paraleliza melhor com sub-agents em PR grande.
          model: 'opus'
          effort: 'max'
          max_turns: '50'
