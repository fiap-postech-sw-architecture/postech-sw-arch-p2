name: Security

# Gates de segurança que faltavam (#75): pip-audit (CVE em deps), gitleaks
# (segredos), trivy (CVE na imagem). Bandit (SAST) fica no ci.yml; CodeQL roda
# pelo default setup do GitHub code scanning (config no repo, job "Analyze
# (python)"). Fecha a divergência doc↔código: os docs de segurança afirmavam
# que estes scanners rodavam "no pipeline CI" — antes deste workflow, falso.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Segunda 07:15 UTC — advisories/CVE novos sem depender de um push.
    - cron: "15 7 * * 1"

permissions:
  contents: read

jobs:
  deps-audit:
    name: pip-audit (CVE em dependências)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      # Audita só as deps de RUNTIME (prod): sem --all-extras/--no-dev exclui
      # `ui` (nicegui, dev-only) e o tooling de teste — que não são superfície
      # de ataque de produção. Os 3 HIGH aceitos de nicegui (#112, CVE-2025-66645
      # /CVE-2026-21873/CVE-2026-25732) ficam de fora por não constarem aqui;
      # os --ignore-vuln abaixo são cinto-e-suspensório caso a resolução mude.
      - name: Exporta lockfile de produção
        run: >-
          uv export --frozen --no-emit-project --no-dev --no-hashes
          --format requirements-txt -o requirements-prod.txt
      - name: pip-audit
        run: >-
          uvx pip-audit -r requirements-prod.txt --strict --progress-spinner off
          --ignore-vuln CVE-2025-66645
          --ignore-vuln CVE-2026-21873
          --ignore-vuln CVE-2026-25732

  secret-scan:
    name: gitleaks (segredos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Binário direto em vez do gitleaks-action: o action exige GITLEAKS_LICENSE
      # em repositórios de organização; o binário roda sem licença. Usa a config
      # do repo (.gitleaks.toml: baseline default + allowlist de FPs dev-only).
      - name: Instala gitleaks
        run: >-
          curl -sSfL
          https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          | tar -xz -C /usr/local/bin gitleaks
      # `dir` varre a ÁRVORE atual (não o histórico git): barra segredos novos
      # entrando por um PR sem re-flagar dev-secrets já removidos que só existem
      # em commits antigos (ex.: o ENCRYPTION_KEY dev do extinto db-image/, ou os
      # valores demo do .env.dev — todos já cobertos pela allowlist).
      - name: gitleaks (árvore atual)
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

  image-scan:
    name: trivy (CVE na imagem)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build da imagem de runtime
        run: docker build -t pytstop:ci-scan .
      # Binário via install script oficial (latest) em vez da trivy-action: a
      # resolução de tag do action é frágil (0.28.0 não existia). HIGH/CRITICAL
      # como gate; ignore-unfixed descarta os CVEs OS aceitos sem fix upstream
      # (ncurses/systemd, #113); .trivyignore lista os IDs conhecidos.
      - name: Instala trivy
        run: >-
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh
          | sh -s -- -b /usr/local/bin
      - name: Trivy image scan
        run: >-
          trivy image --severity HIGH,CRITICAL --ignore-unfixed --no-progress
          --ignorefile .trivyignore --exit-code 1 pytstop:ci-scan
        env:
          TRIVY_DB_REPOSITORY: public.ecr.aws/aquasecurity/trivy-db
