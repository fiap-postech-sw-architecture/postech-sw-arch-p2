services:
  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.dev
    entrypoint: ["./entrypoint.sh"]

  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pytstop}
      - POSTGRES_USER=${POSTGRES_USER:-pytstop}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pytstop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pytstop}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
