services:
  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env.dev
    entrypoint: ["./entrypoint.sh"]

  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-pytstop}
      - POSTGRES_USER=${POSTGRES_USER:-pytstop}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-pytstop}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pytstop}"]
      interval: 5s
      timeout: 5s
      retries: 5

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "${UI_PORT:-8080}:8080"
    depends_on:
      app:
        condition: service_started
    environment:
      - BACKEND_URL=http://app:8000
      - UI_PORT=8080

volumes:
  postgres_data:
