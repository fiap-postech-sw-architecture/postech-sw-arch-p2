<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="pyblue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5A9FD4"/>
      <stop offset="100%" style="stop-color:#3776AB"/>
    </linearGradient>
    <linearGradient id="pyyellow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD43B"/>
      <stop offset="100%" style="stop-color:#FFC107"/>
    </linearGradient>
    <linearGradient id="geargrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#475569"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="90" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03">
    <line x1="0" y1="64" x2="512" y2="64" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="128" x2="512" y2="128" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="192" x2="512" y2="192" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="320" x2="512" y2="320" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#fff" stroke-width="1"/>
    <line x1="0" y1="448" x2="512" y2="448" stroke="#fff" stroke-width="1"/>
    <line x1="64" y1="0" x2="64" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="192" y1="0" x2="192" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="320" y1="0" x2="320" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#fff" stroke-width="1"/>
    <line x1="448" y1="0" x2="448" y2="512" stroke="#fff" stroke-width="1"/>
  </g>

  <!-- Main gear centered -->
  <g transform="translate(256,210)">
    <!-- Gear teeth -->
    <rect x="-18" y="-138" width="36" height="30" rx="5" fill="url(#geargrad)"/>
    <rect x="-18" y="108" width="36" height="30" rx="5" fill="url(#geargrad)"/>
    <rect x="-138" y="-18" width="30" height="36" rx="5" fill="url(#geargrad)"/>
    <rect x="108" y="-18" width="30" height="36" rx="5" fill="url(#geargrad)"/>
    <rect x="72" y="-108" width="32" height="28" rx="5" fill="url(#geargrad)" transform="rotate(45,88,-94)"/>
    <rect x="-104" y="-108" width="32" height="28" rx="5" fill="url(#geargrad)" transform="rotate(-45,-88,-94)"/>
    <rect x="72" y="80" width="32" height="28" rx="5" fill="url(#geargrad)" transform="rotate(-45,88,94)"/>
    <rect x="-104" y="80" width="32" height="28" rx="5" fill="url(#geargrad)" transform="rotate(45,-88,94)"/>

    <!-- Gear outer ring -->
    <circle cx="0" cy="0" r="108" fill="none" stroke="#475569" stroke-width="6"/>
    <!-- Gear body -->
    <circle cx="0" cy="0" r="92" fill="#1e293b"/>
    <circle cx="0" cy="0" r="92" fill="#334155" opacity="0.5"/>

    <!-- Python logo stylized - two intertwined snakes -->
    <!-- Blue half (top-left) -->
    <path d="M-8,-55 C-8,-65 -2,-70 8,-70 L28,-70 C38,-70 44,-64 44,-54 L44,-20 C44,-10 38,-4 28,-4 L-12,-4 C-22,-4 -28,2 -28,12 L-28,20"
          fill="none" stroke="url(#pyblue)" stroke-width="10" stroke-linecap="round"/>
    <!-- Blue head dot -->
    <circle cx="-20" cy="-54" r="5" fill="#5A9FD4"/>

    <!-- Yellow half (bottom-right) -->
    <path d="M8,55 C8,65 2,70 -8,70 L-28,70 C-38,70 -44,64 -44,54 L-44,20 C-44,10 -38,4 -28,4 L12,4 C22,4 28,-2 28,-12 L28,-20"
          fill="none" stroke="url(#pyyellow)" stroke-width="10" stroke-linecap="round"/>
    <!-- Yellow head dot -->
    <circle cx="20" cy="54" r="5" fill="#FFD43B"/>

    <!-- Wrench accent crossing diagonally -->
    <g opacity="0.15">
      <line x1="-70" y1="70" x2="70" y2="-70" stroke="#94a3b8" stroke-width="8" stroke-linecap="round"/>
      <circle cx="74" cy="-74" r="12" fill="none" stroke="#94a3b8" stroke-width="5"/>
    </g>
  </g>

  <!-- PytStop text -->
  <text x="256" y="400" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="58" font-weight="800" fill="#e2e8f0" letter-spacing="2">
    <tspan fill="#5A9FD4">Pyt</tspan><tspan fill="#FFD43B">Stop</tspan>
  </text>

  <!-- Tagline -->
  <text x="256" y="435" text-anchor="middle" font-family="'Segoe UI', Arial, Helvetica, sans-serif" font-size="16" fill="#64748b" letter-spacing="3">FASE 1 // ARQUITETURA DE SW</text>

  <!-- Bottom accent line -->
  <line x1="156" y1="460" x2="356" y2="460" stroke="#334155" stroke-width="2"/>
  <line x1="196" y1="460" x2="256" y2="460" stroke="#3776AB" stroke-width="2"/>
  <line x1="256" y1="460" x2="316" y2="460" stroke="#FFD43B" stroke-width="2"/>
</svg>