# Prometheus — backend de metricas da demonstracao (TD-022/ADR-024). Scrapeia
# o /metrics do relay (`pytstop-relay-metrics:9100`, exposto por relay/metrics.py
# via MeterProvider + PrometheusMetricReader) e disponibiliza a UI/PromQL por
# port-forward na gravacao do video. Mesmo padrao de workload de demo do Mailpit
# (ADR-018) e do Jaeger (ADR-020): ConfigMap + Deployment + Service ClusterIP,
# storage em memoria (`--storage.tsdb` default efemero), ZERO persistencia —
# cluster local/efemero, sem PVC.
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: pytstop
  labels:
    app: prometheus
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      # Alvo unico da demo: o /metrics do relay via Service ClusterIP. Targets
      # estaticos (sem service-discovery do k8s) bastam para um alvo fixo e
      # mantem o RBAC minimo — o pod nao precisa ler a API do cluster. O
      # scrape_interval e herdado do bloco global (15s acima).
      - job_name: pytstop-relay
        static_configs:
          - targets:
              - pytstop-relay-metrics:9100
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: pytstop
  labels:
    app: prometheus
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
        - name: prometheus
          # Tag imutavel (ADR-019): nada de `:latest`, build reproduzivel.
          image: prom/prometheus:v2.54.1
          imagePullPolicy: IfNotPresent
          args:
            - --config.file=/etc/prometheus/prometheus.yml
          ports:
            - name: http
              containerPort: 9090
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
          # Footprint modesto: carga de demo, um unico alvo de scrape, TSDB em
          # memoria. Memoria acima do Mailpit porque o Prometheus mantem a
          # serie temporal e os indices em memoria.
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 512Mi
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: pytstop
  labels:
    app: prometheus
spec:
  type: ClusterIP
  selector:
    app: prometheus
  ports:
    - name: http
      port: 9090
      targetPort: 9090
