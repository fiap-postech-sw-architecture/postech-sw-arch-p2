# Deployment da API (RNF-020). Probes e resources sao pre-requisitos do
# HPA (RNF-023); valores baseline da RFC-002 §5, a calibrar com a
# medicao de carga do full-test/.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pytstop-api
  namespace: pytstop
  labels:
    app: pytstop-api
spec:
  # A migracao roda no Job `pytstop-migrate` ANTES do rollout (TD-015;
  # ADR-019; RFC-002 §7), entao a corrida de migracoes concorrentes nao
  # existe mais -- N replicas podem subir juntas com seguranca sobre o
  # schema ja em head. `replicas: 1` aqui e' so o piso do HPA (hpa.yaml,
  # min 1 / max 5): depois do boot o HPA assume a contagem; reaplicar este
  # manifest com o HPA ativo reduz momentaneamente para 1 -- aceito no
  # cluster de demo.
  replicas: 1
  selector:
    matchLabels:
      app: pytstop-api
  template:
    metadata:
      labels:
        app: pytstop-api
    spec:
      # Hardening de pod (TD-024): roda como nao-root com UID/GID numericos
      # (casam o Dockerfile), seccomp default e fsGroup para a montagem /tmp.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # O CD troca esta tag pela tag imutavel do SHA do commit
          # (ADR-019). `dev` e a tag do fluxo local: build + `kind load`.
          image: ghcr.io/fiap-postech-sw-architecture/postech-sw-arch-p2-app:dev
          # A imagem chega aos nos via `kind load`, nao por pull do GHCR
          # privado -- sem imagePullSecret (RFC-002 §4).
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: pytstop-config
            - secretRef:
                name: pytstop-secrets
          # Probes na rota de saude real, fora do middleware de
          # autenticacao -- o kubelet nao envia token (RNF-023; RFC-002
          # §5). Migracao e seed rodam antes do rollout no Job
          # `pytstop-migrate` (TD-015), nao no boot do pod: o initialDelay
          # da readiness cobre apenas a subida do uvicorn sobre o schema ja
          # migrado.
          # timeoutSeconds/failureThreshold explicitos: o default de
          # timeoutSeconds e 1s — apertado sob carga (o proprio HPA so
          # escala DEPOIS do pico); 3s evita flap de Ready/restart por um
          # GET lento, e 3 falhas seguidas continuam sendo o criterio.
          readinessProbe:
            httpGet:
              path: /api/v1/saude
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/v1/saude
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          # Baseline RFC-002 §5 -- o HPA calcula a porcentagem de
          # utilizacao sobre o REQUEST, nao sobre o limit.
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          # Hardening de container (TD-024): sem escalonamento de privilegio,
          # root FS somente-leitura, todas as capabilities dropadas. O /tmp e um
          # emptyDir gravavel (uvicorn/libs podem escrever temporarios).
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
