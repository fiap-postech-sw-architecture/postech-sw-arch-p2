# VALORES DE DEMONSTRACAO -- cluster kind local/efemero da fase 2, sem
# dado real. Producao usaria SealedSecrets/External Secrets e injecao de
# valores no momento do apply, nunca segredo real commitado (RFC-002 §6).
apiVersion: v1
kind: Secret
metadata:
  name: pytstop-secrets
  namespace: pytstop
type: Opaque
stringData:
  # Demo only. HS256 exige >= 32 bytes (validado no startup do app).
  JWT_SECRET: "demo-jwt-secret-pytstop-fase2-no-minimo-32-bytes"
  # Demo only. Chave Fernet valida gerada para esta demo -- precisa ser
  # estavel entre replicas e restarts, senao ciphertexts de PII deixam
  # de decifrar (RFC-002 §5; RNF-024). O `gitleaks:allow` marca o valor
  # como demo deliberado (base64 dispara o generic-api-key do scanner).
  ENCRYPTION_KEY: "C9I0jOzZ9kJBTY0akV3TvBO2wa1JcuAdR-Wctnzee6I="  # gitleaks:allow
  # Demo only. DNS cross-namespace do Service do StatefulSet criado pelo
  # Terraform em /infra (ADR-017); credenciais demo alinhadas ao que o
  # Terraform provisiona (db pytstop, user pytstop, senha pytstop-demo).
  DATABASE_URL: "postgresql://pytstop:pytstop-demo@postgres.pytstop-infra.svc.cluster.local:5432/pytstop"
  # Demo only. Admin inicial criado pelo seed best-effort do entrypoint
  # (RUN_SEED_ON_STARTUP no configmap.yaml).
  ADMIN_EMAIL: "admin@pytstop.local"
  ADMIN_PASSWORD: "pytstop-admin-demo-2026"
  # Demo only. Token do canal externo de decisao de orcamento (RF-022 /
  # ADR-021); mesmo valor demo do docker-compose.yml -- paridade
  # dev x cluster.
  ORCAMENTO_WEBHOOK_TOKEN: "demo-webhook-orcamento-nao-usar-em-producao"
