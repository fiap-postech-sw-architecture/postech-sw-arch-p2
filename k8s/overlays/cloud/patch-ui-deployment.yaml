# Alvo cloud (ADR-025 adendo): a UI passa a ler tambem o Secret
# pytstop-ui-secrets (UI_SENHA_ATENDENTE/UI_SENHA_MECANICO — senhas FORTES
# geradas no .env.cloud e materializadas pelo make no deploy). `optional:
# true` mantem kind/compose intactos (la o Secret nao existe e os atalhos
# usam as senhas dev fixas).
#
# NOTA: envFrom e' lista SEM merge key no strategic merge — o patch precisa
# repetir a entrada da base (configMapRef) ou ela seria descartada.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pytstop-ui
  namespace: pytstop
spec:
  template:
    spec:
      containers:
        - name: ui
          envFrom:
            - configMapRef:
                name: pytstop-ui-config
            - secretRef:
                name: pytstop-ui-secrets
                optional: true
