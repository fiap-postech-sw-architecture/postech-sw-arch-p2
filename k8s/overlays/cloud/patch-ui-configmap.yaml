# Patch do ConfigMap da UI para o alvo cloud (ADR-025 adendo): atalhos de
# login so para atendente/mecanico. O admin do cloud tem senha FORTE fora
# da UI (login manual); atendente/mecanico sao seedados com senha forte
# injetada em UI_SENHA_<PAPEL> pelo Secret pytstop-ui-secrets (criado pelo
# make no deploy — ver patch-ui-deployment.yaml). Sem o admin na lista, o
# probe de "seed nao encontrado" (check de dev) nem roda.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pytstop-ui-config
  namespace: pytstop
data:
  UI_ATALHOS_PAPEIS: "atendente,mecanico"
